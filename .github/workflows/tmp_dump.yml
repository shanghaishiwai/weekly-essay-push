name: tmp-dump

on:
  workflow_dispatch:

jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: dump
        env:
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        run: python tmp_dump.py
