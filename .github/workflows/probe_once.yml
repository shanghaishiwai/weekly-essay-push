name: probe-once

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: run probe
        env:
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        run: python probe_once.py
