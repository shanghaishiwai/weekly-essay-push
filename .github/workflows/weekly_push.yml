name: 每周五分钟作文素材推送

on:
  # 定时任务：UTC 12:20 = 北京时间 20:20，星期 5 = 每周五
  schedule:
    - cron: "20 12 * * 5"
  # 允许在网页上手动点一下按钮就立刻运行一次（用来测试，不用等周五）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-essay-material:
    name: 生成并推送作文素材
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 把代码下载到运行环境
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖（只有 requests 一个）
        run: pip install -r requirements.txt

      # ---- 体检步骤：判断 Secrets 里的令牌是哪种类型（不打印令牌内容）----
      - name: 令牌体检
        env:
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          APPTOKEN: ${{ secrets.APPTOKEN }}
          UID: ${{ secrets.UID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          # 让 GitHub 在日志里自动打码这串令牌
          if [ -n "$WXPUSHER_SPT" ]; then echo "::add-mask::$WXPUSHER_SPT"; fi
          echo "令牌已从 Secrets 取出（内容不会显示）"
          python diagnose.py
      - name: 调用 DeepSeek 生成素材，并用 WxPusher 推送
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: python main.py
